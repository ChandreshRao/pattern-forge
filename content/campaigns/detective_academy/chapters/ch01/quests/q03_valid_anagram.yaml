      expected: false
      hidden: true
  hints:
    - level: 1
      text: "Clarify what must be identical between the two tips."
    - level: 2
      text: "Order can change; something else must stay the same."
    - level: 3
      text: "Counting how often each symbol appears helps."
    - level: 4
      text: "Compare frequency maps of both strings."
    - level: 5
      text: "Near-pseudocode: if lengths differ false; else compare character counts."
  reflection:
    why: "You proved equivalence by counting symbols instead of trying every rearrangement."
    common_mistakes:
      - "Sorting both strings then forgetting length checks"
      - "Comparing only unique characters without frequencies"
    complexity:
      time: "O(n)"
      space: "O(1)"
  interview_reference: "LeetCode 242 — Valid Anagram"

story:
  hook: >
    In the records room, two courier slips sit under Quin's lamp — same ink smell,
    letters scrambled like a coded habit.
  briefing: >
    Captain Mora needs confirmation before dawn. Are these two tips the same message
    with letters rearranged, or a forged pair? Quin mentions a letter tally on a
    courier slip can settle it without reading every permutation aloud.
  objective_in_world: >
    Confirm whether the two tips use the same letters with the same counts.
  success_line: >
    The courier habit is confirmed; the coded tips match.
  reflection_flavor: >
    Mora pins the case board. Forged duplicates and scrambled tips were only the desk work —
    field cases wait beyond the academy door.
