  constraints_text: >
    Find the contiguous run of at least one number in nums with the largest
    sum, and return that sum.
  examples:
    - input: { nums: [-2, 1, -3, 4, -1, 2, 1, -5, 4] }
      output: 6
    - input: { nums: [1] }
      output: 1
  tests:
    - id: t1
      input: { nums: [-2, 1, -3, 4, -1, 2, 1, -5, 4] }
      expected: 6
      hidden: false
    - id: t2
      input: { nums: [1] }
      expected: 1
      hidden: false
    - id: t3
      input: { nums: [5, 4, -1, 7, 8] }
      expected: 23
      hidden: true
    - id: t4
      input: { nums: [-1] }
      expected: -1
      hidden: true
    - id: t5
      input: { nums: [-2, -1] }
      expected: -1
      hidden: true
    - id: t6
      input: { nums: [-3, -2, -1, -4] }
      expected: -1
      hidden: true
    - id: t7
      input: { nums: [1, 2, 3, 4, 5] }
      expected: 15
      hidden: true
    - id: t8
      input: { nums: [0, 0, 0, 0] }
