  constraints_text: >
    The values array represents a trail of informants in order, first to
    last. Return the trail reversed, last to first. The trail may be empty.
  examples:
    - input: { values: [1, 2, 3, 4, 5] }
      output: [5, 4, 3, 2, 1]
    - input: { values: [] }
      output: []
  tests:
    - id: t1
      input: { values: [1, 2, 3, 4, 5] }
      expected: [5, 4, 3, 2, 1]
      hidden: false
    - id: t2
      input: { values: [] }
      expected: []
      hidden: false
    - id: t3
      input: { values: [1] }
      expected: [1]
      hidden: true
    - id: t4
      input: { values: [1, 2] }
      expected: [2, 1]
      hidden: true
    - id: t5
      input: { values: [7, 7, 7] }
      expected: [7, 7, 7]
      hidden: true
    - id: t6
      input: { values: [-1, -2, -3] }
      expected: [-3, -2, -1]
      hidden: true
    - id: t7
      input: { values: [0, 1, 0, 1] }
      expected: [1, 0, 1, 0]
      hidden: true
    - id: t8
      input: { values: [10, 20, 30, 40, 50, 60] }
      expected: [60, 50, 40, 30, 20, 10]
      hidden: true
    - id: t9
      input: { values: [5] }
