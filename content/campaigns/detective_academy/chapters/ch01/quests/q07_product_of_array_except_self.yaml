  hints:
    - level: 1
      text: "Clarify what each output slot needs: everything multiplied together except that slot's own value."
    - level: 2
      text: "Think about what you can build by walking left to right, then again right to left."
    - level: 3
      text: "A running product from the left side and a running product from the right side can meet in the middle."
    - level: 4
      text: "Combine the left-running product and the right-running product for each position, without ever dividing by that position's own value."
    - level: 5
      text: "Near-pseudocode: build prefix products left-to-right; build suffix products right-to-left; multiply prefix[i-1] by suffix[i+1] for each position i."
  reflection:
    why: "You combined a running product from each side instead of dividing the current value back out."
    common_mistakes:
      - "Using division and breaking on a zero value"
      - "Only computing the product from one direction"
      - "Off-by-one errors when combining the left and right running products"
    complexity:
      time: "O(n)"
      space: "O(n)"
  interview_reference: "LeetCode 238 — Product of Array Except Self"

story:
  hook: >
    A courier drop lands on the night desk: five sealed receipts stacked in
    a row, each hiding its own total, but the drop note wants every
    receipt's missing total guessed from the others.
  briefing: >
    Archivist Quin spreads the receipts left to right. For each receipt,
    work out what all the other receipts multiply to, without peeking at
    that one receipt's own number and without simply dividing it back out.
    Captain Mora warns that a stray zero receipt can wreck a careless guess.
  objective_in_world: >
    For every receipt, work out the combined total of every other receipt
    in the row, leaving that one receipt's own value untouched.
  success_line: >
    Every receipt's blind total checks out; the drop is logged clean.
  reflection_flavor: >
    Mora squares the stack. Somewhere in evidence, a paperclip trail of
    informants still needs to be walked backward.
