  title: "Paired Receipts"
  pattern_id: hash_map
  pattern_reveal_name: "Hash Map"
  recognition_signals:
    - pair_lookup
    - complement
    - one_pass
  difficulty_rank: explorer
  languages:
    python:
      function_name: two_sum
      starter: |
        from typing import List

