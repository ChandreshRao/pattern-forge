  constraints_text: >
    Return true if t is an anagram of s (same characters with the same frequencies).
    Strings consist of lowercase English letters.
  examples:
    - input: { s: "anagram", t: "nagaram" }
      output: true
    - input: { s: "rat", t: "car" }
      output: false
  tests:
    - id: t1
      input: { s: "anagram", t: "nagaram" }
      expected: true
      hidden: false
    - id: t2
      input: { s: "rat", t: "car" }
      expected: false
      hidden: false
    - id: t3
      input: { s: "hello", t: "world" }
      expected: false
      hidden: true
    - id: t4
      input: { s: "a", t: "a" }
      expected: true
      hidden: true
    - id: t5
      input: { s: "a", t: "b" }
      expected: false
      hidden: true
    - id: t6
      input: { s: "aabbcc", t: "abcabc" }
      expected: true
      hidden: true
    - id: t7
      input: { s: "listen", t: "silent" }
      expected: true
      hidden: true
    - id: t8
