         */
        function twoSum(nums, target) {
          
        }
    typescript:
      function_name: twoSum
      starter: |
        function twoSum(nums: number[], target: number): number[] {
          
        }
  constraints_text: >
    Find two distinct indices whose values sum to the target. Exactly one valid
    pair exists. Array length is at least 2.
  examples:
    - input: { nums: [2, 7, 11, 15], target: 9 }
      output: [0, 1]
    - input: { nums: [3, 2, 4], target: 6 }
      output: [1, 2]
  tests:
    - id: t1
      input: { nums: [2, 7, 11, 15], target: 9 }
      expected: [0, 1]
      hidden: false
    - id: t2
      input: { nums: [3, 2, 4], target: 6 }
      expected: [1, 2]
      hidden: false
    - id: t3
      input: { nums: [3, 3], target: 6 }
      expected: [0, 1]
      hidden: true
    - id: t4
      input: { nums: [-1, -2, -3, -4, -5], target: -8 }
      expected: [2, 4]
      hidden: true
    - id: t5
      input: { nums: [1, 5, 3, 8], target: 9 }
      expected: [0, 3]
      hidden: true
    - id: t6
      input: { nums: [0, 4, 3, 0], target: 0 }
      expected: [0, 3]
      hidden: true
    - id: t7
      input: { nums: [2, 5, 5, 11], target: 10 }
      expected: [1, 2]
      hidden: true
    - id: t8
      input: { nums: [1, 2, 3, 4, 5, 6], target: 11 }
      expected: [4, 5]
      hidden: true
  hints:
    - level: 1
      text: "Clarify what two values must satisfy."
    - level: 2
      text: "Think about remembering what you have already seen."
    - level: 3
      text: "A fast lookup structure helps."
    - level: 4
      text: "For each value, check if its complement was seen."
    - level: 5
      text: "Near-pseudocode: scan once; store value→index; probe target-value."
  reflection:
    why: "You looked up complements in constant time instead of checking every pair."
    common_mistakes:
      - "Using the same index twice"
      - "Returning values instead of indices"
    complexity:
      time: "O(n)"
      space: "O(n)"
  interview_reference: "LeetCode 1 — Two Sum"

story:
  hook: >
    Rain ticks the night-desk lamp. Two evidence tag numbers sit in the
    intake tray, waiting to match a sealed case code before the warrant window dies.
  briefing: >
    Captain Mora does not raise her voice. Find the pair of tags that add up to
    the sealed code — wrong pair wastes the window. Archivist Quin leaves the
    filing cabinet unlocked; speed matters more than a full drawer search.
  objective_in_world: >
    Identify which two tag indices sum to the sealed case code.
  success_line: >
    The warrant window holds; the paired tags clear intake.
  reflection_flavor: >
    Quin closes the cabinet. Somewhere in the same drawer, duplicate stamps
    are already stacking up.
