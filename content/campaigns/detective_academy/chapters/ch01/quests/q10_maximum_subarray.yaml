    - id: t16
      input: { nums: [-1, -2, -3, 0, -1] }
      expected: 0
      hidden: true
  hints:
    - level: 1
      text: "Clarify what 'contiguous' means — no skipping around, just a connected run."
    - level: 2
      text: "Think about the best run ending exactly at the current position, updated as you move forward."
    - level: 3
      text: "If the run ending here would be worse than starting fresh at the current spot, restart the run."
    - level: 4
      text: "Track a running total for 'best run ending here' and separately the best total seen anywhere so far."
    - level: 5
      text: "Near-pseudocode: current = nums[0]; best = nums[0]; for each later value, current = max(value, current + value); best = max(best, current)."
  reflection:
    why: "You tracked the best run ending at each position instead of checking every possible run."
    common_mistakes:
      - "Resetting the running total to zero instead of to the current value when it goes negative"
      - "Forgetting the array can be all negative, so the answer is the least-negative single value"
      - "Confusing the best run ending here with the best run overall"
    complexity:
      time: "O(n)"
      space: "O(1)"
  interview_reference: "LeetCode 53 — Maximum Subarray"

story:
  hook: >
    The case board is a row of pinned leads, some solid, some dead ends,
    stretching the length of the records room wall — and the captain wants
    the strongest connected streak, not just the biggest single pin.
  briefing: >
    Captain Mora traces the pins with a finger. A streak only counts if the
    pins are side by side with nothing skipped, and a weak pin can still be
    worth keeping if it's bridging two strong ones. Find the strongest
    unbroken streak on the board.
  objective_in_world: >
    Find the largest total value of any unbroken run of adjacent pins on
    the case board.
  success_line: >
    The strongest streak is circled; the case board finally tells a clean
    story.
  reflection_flavor: >
    Quin steps back from the board, pleased. The night desk lamp is already
    dimming — whatever comes next waits past the academy gate.
