x-logging:
  &default-logging
  logging:
    driver: json-file
    options:
      max-size: 100M

# Official judge0/judge0:1.13.1 requires cgroups v1.
# On Docker Desktop (Windows/macOS) and modern Linux (cgroups v2), use the
# CE-compatible image below (same API, isolate with cgroup v2 support).
# Swap image back to judge0/judge0:1.13.1 on hosts with cgroups v1 if preferred.

services:
  server:
    image: mrkushalsm/judge0:latest
    volumes:
      - ./judge0.conf:/judge0.conf:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    ports:
      - "2358:2358"
    privileged: true
    <<: *default-logging
    restart: always

  workers:
    image: mrkushalsm/judge0:latest
    command: ["./scripts/workers"]
    volumes:
      - ./judge0.conf:/judge0.conf:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    privileged: true
    <<: *default-logging
    restart: always

  db:
    image: postgres:16.2
    env_file: judge0.conf
    volumes:
      - data:/var/lib/postgresql/data/
    <<: *default-logging
    restart: always

  redis:
    image: redis:7.2.4
    command: [
      "bash", "-c",
      'docker-entrypoint.sh --appendonly no --requirepass "$$REDIS_PASSWORD"'
    ]
    env_file: judge0.conf
    <<: *default-logging
    restart: always

volumes:
  data:
