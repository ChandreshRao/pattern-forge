  hints:
    - level: 1
      text: "Clarify what 'reversed' means for a trail you can only walk one direction at a time."
    - level: 2
      text: "Think about what you need to remember about the informant behind the one you're currently visiting."
    - level: 3
      text: "Each step, the trail should end up pointing back at where you came from, not forward."
    - level: 4
      text: "Walk the trail once, flipping each link to point at the previous informant as you go."
    - level: 5
      text: "Near-pseudocode: keep previous = none; for each informant, remember the next one, point the current one back at previous, then advance previous and current."
  reflection:
    why: "You flipped each link to point backward in a single walk instead of rebuilding the trail from scratch."
    common_mistakes:
      - "Losing the reference to the next node before rewiring the current one"
      - "Forgetting to update the head and tail after the flip"
      - "Off-by-one errors that drop the first or last informant"
    complexity:
      time: "O(n)"
      space: "O(1)"
  interview_reference: "LeetCode 206 — Reverse Linked List"

story:
  hook: >
    A paperclipped stack of informant cards sits in the evidence locker,
    each card pointing to the next name in the chain, until someone asks
    for the chain read backward.
  briefing: >
    Captain Mora needs the trail flipped end to end: the last informant
    contacted should now lead, the first should trail last. Quin warns that
    once you unclip a card you cannot glance ahead — you only get to look
    at the card in your hand and the one right before it.
  objective_in_world: >
    Flip the informant trail so it runs in the exact opposite order, one
    card at a time.
  success_line: >
    The trail runs backward clean; the chain of contacts is intact.
  reflection_flavor: >
    Quin re-clips the stack, satisfied. Out on the street, a moving watch
    is due to start along a stretch that never repeats itself.
