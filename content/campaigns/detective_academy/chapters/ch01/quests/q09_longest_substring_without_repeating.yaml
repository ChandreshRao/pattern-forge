  hints:
    - level: 1
      text: "Clarify what 'no repeating characters' means inside one contiguous stretch."
    - level: 2
      text: "Think of a stretch you're watching that can grow or shrink as you walk it."
    - level: 3
      text: "When a character you've already seen shows up again inside your current stretch, the stretch's start has to jump forward."
    - level: 4
      text: "Track the last position you saw each character; shrink the window's start past any earlier duplicate."
    - level: 5
      text: "Near-pseudocode: walk the right edge forward one character at a time; if it's already in the current window, move the left edge past its last occurrence; track the longest window length seen."
  reflection:
    why: "You grew and shrank a moving stretch of the string instead of checking every possible substring."
    common_mistakes:
      - "Shrinking the window by only one step instead of jumping past the duplicate's last position"
      - "Forgetting to update the longest length after every step, not just after a shrink"
      - "Not handling an empty string"
    complexity:
      time: "O(n)"
      space: "O(min(n, alphabet size))"
  interview_reference: "LeetCode 3 — Longest Substring Without Repeating Characters"

story:
  hook: >
    Captain Mora spreads a night's worth of signal logs across the night
    desk — one symbol per minute, and she wants the longest stretch where
    nothing repeats.
  briefing: >
    Mora taps the log. Walk the stretch minute by minute; the moment a
    signal repeats inside your current watch, the watch has to start over
    from just past the last time you saw it. Report only the longest clean
    stretch you find.
  objective_in_world: >
    Find the length of the longest run of minutes in the log where no
    signal repeats.
  success_line: >
    The longest clean stretch is logged; the night's watch report is done.
  reflection_flavor: >
    Quin marks the report and glances at the case board, where a run of
    strong nights and weak nights is waiting to be measured.
