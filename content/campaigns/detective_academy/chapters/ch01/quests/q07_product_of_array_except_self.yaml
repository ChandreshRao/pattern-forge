  constraints_text: >
    Return an array where each position holds the product of every value in
    nums except the value at that position. Do not use division. The array
    has at least two entries.
  examples:
    - input: { nums: [1, 2, 3, 4] }
      output: [24, 12, 8, 6]
    - input: { nums: [-1, 1, 0, -3, 3] }
      output: [0, 0, 9, 0, 0]
  tests:
    - id: t1
      input: { nums: [1, 2, 3, 4] }
      expected: [24, 12, 8, 6]
      hidden: false
    - id: t2
      input: { nums: [-1, 1, 0, -3, 3] }
      expected: [0, 0, 9, 0, 0]
      hidden: false
    - id: t3
      input: { nums: [2, 3] }
      expected: [3, 2]
      hidden: true
    - id: t4
      input: { nums: [1, 1] }
      expected: [1, 1]
      hidden: true
    - id: t5
      input: { nums: [0, 0] }
      expected: [0, 0]
      hidden: true
    - id: t6
      input: { nums: [5, 0] }
      expected: [0, 5]
      hidden: true
    - id: t7
      input: { nums: [-2, -3, -4] }
      expected: [12, 8, 6]
      hidden: true
    - id: t8
      input: { nums: [1, 2, 3, 4, 5] }
      expected: [120, 60, 40, 30, 24]
      hidden: true
    - id: t9
      input: { nums: [4, 3, 2, 1, 2] }
      expected: [12, 16, 24, 48, 24]
      hidden: true
    - id: t10
      input: { nums: [0, 4, 0] }
      expected: [0, 0, 0]
      hidden: true
    - id: t11
      input: { nums: [-1, -1, -1, -1] }
      expected: [-1, -1, -1, -1]
      hidden: true
    - id: t12
      input: { nums: [10, 3, 5, 6, 2] }
      expected: [180, 600, 360, 300, 900]
      hidden: true
    - id: t13
      input: { nums: [1, 0] }
      expected: [0, 1]
      hidden: true
    - id: t14
      input: { nums: [2, 2, 2, 2] }
      expected: [8, 8, 8, 8]
