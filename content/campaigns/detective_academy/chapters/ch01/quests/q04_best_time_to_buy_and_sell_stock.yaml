  hints:
    - level: 1
      text: "Clarify what 'buy low, then sell later at a higher price' means as a single pass."
    - level: 2
      text: "Think about tracking the lowest mark seen so far as you move forward."
    - level: 3
      text: "At each new mark, the best profit so far compares the current mark against the lowest mark seen."
    - level: 4
      text: "Update a running lowest price and a running best profit in the same pass."
    - level: 5
      text: "Near-pseudocode: track min_so_far starting at the first price; for each later price, compute price - min_so_far and keep the max; update min_so_far whenever a lower price appears."
  reflection:
    why: "You tracked the lowest price seen so far instead of comparing every buy-sell pair."
    common_mistakes:
      - "Comparing every pair with nested loops instead of a single pass"
      - "Forgetting profit can't go below zero if no later day is higher"
      - "Selling before buying by using a low price that comes after the sell day"
    complexity:
      time: "O(n)"
      space: "O(1)"
  interview_reference: "LeetCode 121 — Best Time to Buy and Sell Stock"

story:
  hook: >
    The records room smells of chalk dust. Someone has marked a week of price
    ticks on the board, one number per day, and a torn corner note demands a
    single best trade.
  briefing: >
    Captain Mora slides the ledger across the desk. Pick one day to buy and a
    later day to sell, and prove the biggest gap between them — a bad pick
    burns the field budget. Archivist Quin says the trick is remembering the
    lowest mark you have chalked so far, not re-reading the whole board each
    time.
  objective_in_world: >
    Find the largest possible gap between an earlier low mark and a later
    higher mark on the ledger.
  success_line: >
    The ledger closes clean; the field budget survives the week.
  reflection_flavor: >
    Quin taps the lowest chalk mark still on the board. Somewhere down the
    hall, a sealed note is waiting to be checked for balance.
